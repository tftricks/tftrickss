name: Diagnostic - CommunityDragon schema check

on:
  push:
    branches: [diag/cdragon-schema-check]
  workflow_dispatch:

jobs:
  check:
    name: Fetch and inspect real en_us.json
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest en_us.json
        run: curl -sS -o /tmp/en_us.json "https://raw.communitydragon.org/latest/cdragon/tft/en_us.json"

      - name: Inspect items[].from nullability (the reported bug)
        run: |
          python3 -c "
          import json
          data = json.load(open('/tmp/en_us.json'))
          items = data.get('items', [])
          print('total items:', len(items))
          null_from = [i.get('apiName') for i in items if 'from' in i and i.get('from') is None]
          print('items with explicit null from:', len(null_from))
          print('sample:', null_from[:5])
          print('items[0]:', json.dumps(items[0], indent=2)[:500] if items else 'NONE')
          "

      - name: Detect current set and confirm champion name matches
        run: |
          python3 -c "
          import json
          data = json.load(open('/tmp/en_us.json'))
          sets = data.get('setData', [])
          current = max(sets, key=lambda s: s.get('number') or -999)
          print('current set number:', current.get('number'))
          champs = current.get('champions', [])
          print('champion count:', len(champs))
          names = {c.get('name') for c in champs if c.get('name')}
          for target in ['Kindred', 'Akali', 'Jax']:
              hit = target in names or any(target.lower() in (n or '').lower() for n in names)
              print(f'{target}: {\"MATCH\" if hit else \"NO MATCH\"}')
          "

      - name: Inspect whether items[] mixes augments with real equipment, and composition field
        run: |
          python3 -c "
          import json
          data = json.load(open('/tmp/en_us.json'))
          items = data.get('items', [])
          augments = [i for i in items if 'augment' in (i.get('apiName') or '').lower()]
          equipment = [i for i in items if 'augment' not in (i.get('apiName') or '').lower()]
          print('total:', len(items), 'augment-like:', len(augments), 'equipment-like:', len(equipment))
          bf = next((i for i in equipment if 'bfsword' in (i.get('apiName') or '').lower()), None)
          print('BF Sword sample:', json.dumps(bf, indent=2)[:600] if bf else 'NOT FOUND')
          bt = next((i for i in equipment if 'bloodthirster' in (i.get('apiName') or '').lower()), None)
          print('Bloodthirster composition:', bt.get('composition') if bt else 'NOT FOUND')
          print('Bloodthirster apiName:', bt.get('apiName') if bt else 'NOT FOUND')
          set17_like = [i for i in equipment if 'tft17' in (i.get('apiName') or '').lower() or 'tft_item' in (i.get('apiName') or '').lower()]
          print('equipment matching tft17/tft_item prefix:', len(set17_like))
          print('sample equipment apiNames:', [i.get('apiName') for i in equipment[:10]])
          "
