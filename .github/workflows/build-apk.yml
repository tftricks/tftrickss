name: Build debug APK

on:
  push: # every push to any branch
  workflow_dispatch: # manual re-run from the Actions tab, no push needed

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME is set, licenses accepted); AGP downloads any missing
      # platform/build-tools automatically. setup-gradle adds Gradle
      # dependency + wrapper caching for faster subsequent builds.
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tftricks-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
