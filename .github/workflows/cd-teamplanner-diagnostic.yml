name: CD Teamplanner Diagnostic (throwaway)

on:
  push:
    paths:
      - '.github/workflows/cd-teamplanner-diagnostic.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch tftchampions-teamplanner.json
        run: |
          curl -sSL "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/tftchampions-teamplanner.json" -o teamplanner.json
          echo "--- byte size ---"
          wc -c teamplanner.json
          echo "--- raw head (3000 chars) ---"
          head -c 3000 teamplanner.json
          echo ""
          echo "--- python structure dump ---"
          python3 - <<'PY'
          import json
          data = json.load(open("teamplanner.json"))
          print("top-level type:", type(data))
          if isinstance(data, dict):
              print("top-level keys:", list(data.keys()))
              for k, v in data.items():
                  print(f"key={k!r} type={type(v)}", end="")
                  if isinstance(v, list):
                      print(f" len={len(v)}")
                      print("first 3 items:", json.dumps(v[:3], indent=2)[:2000])
                  elif isinstance(v, dict):
                      print(f" keys(sample)={list(v.keys())[:10]}")
                  else:
                      print(f" value={v!r}")
          elif isinstance(data, list):
              print("length:", len(data))
              print("first 5 items:", json.dumps(data[:5], indent=2)[:3000])
          PY
