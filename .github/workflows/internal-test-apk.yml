name: Build internal test APK (debug UI off, not for Play Store)

# Produces a release-type APK (BuildConfig.DEBUG = false, so every debug
# panel/banner is hidden) signed with a throwaway keystore generated fresh
# in this job — no repository secrets needed. This is strictly for
# installing on your own device to try the app; NEVER upload this APK's
# signature to Google Play. When you're ready for a real Play Store
# release, use the "Build signed release AAB + APK" workflow instead,
# which signs with your real keystore via repo secrets.
#
# Since the signing key is regenerated every run, a newer build from this
# workflow won't install as an "update" over an older one — uninstall the
# previous test build first if Android refuses the install.

on:
  push:
    paths:
      - '.github/workflows/internal-test-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned-for-Play-Store test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate throwaway signing key (internal testing only)
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/internal-test.keystore" \
            -alias internaltest -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass internaltest -keypass internaltest \
            -dname "CN=TFTricks Internal Test, O=TFTricks, C=US"

      - name: Build release-type APK
        env:
          TFTRICKS_KEYSTORE_PATH: ${{ github.workspace }}/internal-test.keystore
          TFTRICKS_STORE_PW: internaltest
          TFTRICKS_KEY_ALIAS: internaltest
          TFTRICKS_KEY_PW: internaltest
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK to tftricks.apk
        run: |
          mkdir -p app/build/outputs/apk/release-renamed
          cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/release-renamed/tftricks.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tftricks-internal-test-apk
          path: app/build/outputs/apk/release-renamed/tftricks.apk
          if-no-files-found: error
